version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cortexflow-db
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexflow-backend
    ports:
      - "8000:8000"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - GRAPH_NAME=cortexflow_brain
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
    driver: local
